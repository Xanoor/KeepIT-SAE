<!doctype html>
<html lang="fr">
    <head>
        <title>Gestion du compte</title>
        <meta charset="UTF-8" />
        <link rel="stylesheet" type="text/css" href="../styles/global.css" />
        <link rel="stylesheet" type="text/css" href="../styles/account-management.css" />
    </head>
    <body>
        <header>
            <div class="nav-left-container">
                <div class="app-name-container">
                    <a href="login.html">KEEPIT</a>
                </div>
                <nav class="nav-buttons-container">
                    <a href="#">Dashboard</a>
                    <a href="inventory.html">Inventaire</a>
                    <a href="#">Techniciens</a>
                    <a href="#">Informations</a>
                </nav>
            </div>
            <nav class="nav-right-container">
                <a href="#" class="profile-btn-selected">Profil</a>
                <a href="#" class="log-out"
                    ><img src="../assets/log-out.png" alt="Deconnexion"
                /></a>
            </nav>
        </header>
        <main class="account-management">
            <div>
                <div class="page-name">
                    <img alt="Logo du site" src="../assets/logo.png" />
                    <h1>Mon compte</h1>
                </div>
            </div>
            <div class="account-container">
                <div class="account-card">
                    <h2>Informations personnelles</h2>
                    <form id="personal-infos-form">
                        <div class="form-group">
                            <label for="first-name">Prénom</label>
                            <input type="text" id="first-name" name="first-name" value="Gabriel" />

                            <label for="last-name">Nom</label>
                            <input type="text" id="last-name" name="last-name" value="Racot" />

                            <label for="job">Fonction</label>
                            <input type="text" id="job" name="job" value="Administrateur WEB" readonly />
                        </div>
                    </form>
                </div>

                <div class="account-card">
                    <h2>Identifiants de connexion</h2>
                    <form id="connexion-infos-form">
                        <div class="form-group">
                            <label for="login">Login</label>
                            <input type="text" id="login" name="login" value="LogGabCot" readonly />

                            <label for="password">Mot de passe</label>
                            <div class="password-wrapper">
                                <input type="password" id="password" name="password" value="GabrielRacotMotDePasseSecurisé#01851" />
                                <span class="eye-icon"></span>
                                <script src="../scripts/account-management.js"></script>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </body>
    <script src="../scripts/callItemForm.js"></script>
</html>
