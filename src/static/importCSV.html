<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Se connecter</title>
        <meta charset="UTF-8" />
        <link rel="stylesheet" type="text/css" href="../styles/global.css" />
        <link rel="stylesheet" type="text/css" href="../styles/importCSV.css" />
    </head>
    <body>
        <header>
            <div class="nav-left-container">
                <div class="app-name-container">
                    <p>NOMCORP</p>
                </div>
                <nav class="nav-buttons-container">
                    <a href="#">Dashboard</a>
                    <a href="./inventory.html" class="nav-buttons-current"
                        >Inventaire</a
                    >
                    <a href="#">Techniciens</a>
                    <a href="#">Informations</a>
                </nav>
            </div>
            <nav class="nav-right-container">
                <a href="#" class="profile-btn">Profil</a>
                <a href="#" class="log-out"></a>
            </nav>
        </header>
        <main>
            <div class="page-name">
                <img src="../assets/logo.png" />
                <h1>Inventaire</h1>
            </div>
            <section>
                <form action="" method="POST" enctype="multipart/form-data">
                    <div class="form-header">
                        <div>
                            <input type="button" value="Retour" name="back" />
                            <select name="device_type">
                                <option disabled selected hidden>
                                    Choisir appareil
                                </option>
                                <option value="CENTRAL_UNIT">
                                    Unité centrale
                                </option>
                                <option value="SCREEN">Écran</option>
                            </select>
                        </div>
                        <div>
                            <input
                                type="submit"
                                value="Charger"
                                name="load_csv"
                                id="load_csv"
                                disabled
                            />
                            <input
                                type="submit"
                                value="Enregistrer"
                                name="import_csv"
                                id="import_csv"
                                disabled
                            />
                        </div>
                    </div>
                    <div class="form-content">
                        <!-- Become active when a file is loaded -->
                        <!-- <div class="table-preview"></div> -->
                        <div class="file-upload-wrapper">
                            <input
                                type="file"
                                name="file"
                                accept=".csv"
                                id="file-upload"
                                class="file-upload-input"
                            />
                            <label for="file-upload" class="file-upload-label">
                                <div class="file-upload-design">
                                    <img
                                        src="../assets/upload.png"
                                        class="file-upload-icon"
                                    />
                                    <span class="file-upload-text"
                                        >Cliquez et choisissez votre fichier
                                        CSV</span
                                    >
                                </div>
                            </label>
                        </div>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
